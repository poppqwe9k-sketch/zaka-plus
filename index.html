    <title>Plus AI</title>
    <script>
      try {
        if ('caches' in window) {
          caches.delete('zaka-plus-v5').catch(() => {});
          caches.delete('zaka-plus-v6').catch(() => {});
          caches.delete('zaka-plus-v7').catch(() => {});
          caches.delete('zaka-plus-v8').catch(() => {});
          caches.delete('zaka-plus-v9').catch(() => {});
        }
        if ('serviceWorker' in navigator) {
          const hadController = Boolean(navigator.serviceWorker.controller);
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (hadController && !sessionStorage.getItem('zaka-sw-reloaded-v8')) {
              sessionStorage.setItem('zaka-sw-reloaded-v8', '1');
              window.location.reload();
            }
          });
          navigator.serviceWorker.getRegistrations().then((regs) => {
            regs.forEach((reg) => reg.update().catch(() => {}));
          }).catch(() => {});
        }
      } catch { /* Ignore SW cleanup issues. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/image-generation-enhancement.js"></script>
