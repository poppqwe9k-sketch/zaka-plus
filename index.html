    <script>
      try {
        const key = 'zaka-plus-chat-v5';
        const saved = JSON.parse(localStorage.getItem(key) || '{}');
        const legacy = JSON.parse(localStorage.getItem('ai_app_settings') || '{}');
        const hasSavedLanguage = Object.prototype.hasOwnProperty.call(saved.settings || {}, 'lang')
          || Object.prototype.hasOwnProperty.call(legacy, 'lang');
        if (!hasSavedLanguage) {
          const browserLanguage = (navigator.languages?.[0] || navigator.language || 'ar').toLowerCase();
          const lang = browserLanguage.startsWith('en') ? 'en' : 'ar';
          localStorage.setItem(key, JSON.stringify({ ...saved, settings: { ...(saved.settings || {}), lang } }));
        }
      } catch { /* Continue with defaults if storage is unavailable. */ }
    </script>
